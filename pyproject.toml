[project]
name = "burlak-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "celery>=5.6.3",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.2",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.51",
    "tqdm>=4.65.0",
    "uvicorn[standard]>=0.49.0",
    "xlrd>=2.0.0",
    "xlsxwriter>=3.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.18",
    "httpx2",
    "fakeredis>=2.36.2",
    "pandas-stubs>=3.0.3.260530",
    "types-openpyxl>=3.1.5.20260518",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:multiprocessing.popen_fork",
    "ignore::RuntimeWarning:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited",
]

[tool.mypy]
strict = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "app.services.card_parser_legacy",
    "app.services.main_legacy",
    "app.services.diagnostic_legacy",
    "app.services.cache_legacy",
    "app.services.file_classifier",
    "app.services.splitter",
    "app.services.bom_parser_service",
    "app.services.comparator_service",
    "app.services.report_service",
    "app.services.heuristic_analyzer",
    "create_test_fixtures",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["xlsxwriter", "xlrd.*", "fakeredis.*"]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/services/*_legacy.py" = ["F841", "F811", "N806", "F821", "E402", "F401"]
"app/services/file_classifier.py" = ["F841", "F811", "N806", "F821", "E402", "F401"]
"app/services/splitter.py" = ["F841", "F811", "N806", "F821", "E402", "F401"]
"app/services/bom_parser_service.py" = ["F841", "F811", "N806", "F821", "E402", "F401"]
"app/services/comparator_service.py" = ["F841", "F811", "N806", "F821", "E402", "F401"]
"app/services/report_service.py" = ["F841", "F811", "N806", "F821", "E402", "F401"]
"app/services/heuristic_analyzer.py" = ["F841", "F811", "N806", "F821", "E402", "F401"]

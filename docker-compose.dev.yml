services:
  redis:
    image: redis:7-alpine
    container_name: dev-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ml-mock:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-ml-mock
    command: uvicorn app.core.ml_stub:app --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    restart: unless-stopped

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: dev-ml-service
    ports:
      - "8001:8000"
    environment:
      OLLAMA_URL: http://ollama:11434/v1
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: dev-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-web
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DB_URL: /data/jobs.db
      STORAGE_PATH: /data
      ML_SERVICE_URL: http://ml-service:8000
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
      ml-mock:
        condition: service_started
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-celery-worker
    command: python -m celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    environment:
      REDIS_URL: redis://redis:6379/0
      DB_URL: /data/jobs.db
      STORAGE_PATH: /data
      ML_SERVICE_URL: http://ml-service:8000
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
      ml-mock:
        condition: service_started
    restart: unless-stopped

volumes:
  ollama_data:

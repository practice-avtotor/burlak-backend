services:
  redis:
    image: redis:7-alpine
    container_name: dev-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-burlak_redis_2024}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-burlak_redis_2024}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ml-mock:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-ml-mock
    command: uvicorn app.core.ml_stub:app --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    profiles:
      - mock
    restart: unless-stopped

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: dev-ml-service
    ports:
      - "8001:8000"
    environment:
      OLLAMA_URL: http://ollama:11434/v1
      OLLAMA_API_KEY: ollama
      LLM_MODEL: qwen2.5:7B
      LLM_TIMEOUT: "120"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: dev-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-web
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-burlak_redis_2024}@redis:6379/0
      DB_URL: /data/jobs.db
      STORAGE_PATH: /data
      ML_SERVICE_URL: http://ml-service:8000
      API_KEY: ${BURLAK_API_KEY:-}
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-celery-worker
    command: python -m celery -A app.worker.celery_app worker --loglevel=info --concurrency=2 -Q celery,unpack,mapping,cards,aggregate,heuristic,cleanup
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-burlak_redis_2024}@redis:6379/0
      DB_URL: /data/jobs.db
      STORAGE_PATH: /data
      ML_SERVICE_URL: http://ml-service:8000
      API_KEY: ${BURLAK_API_KEY:-}
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-celery-beat
    command: python -m celery -A app.worker.celery_app beat --loglevel=info
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-burlak_redis_2024}@redis:6379/0
      DB_URL: /data/jobs.db
      STORAGE_PATH: /data
      ML_SERVICE_URL: http://ml-service:8000
      API_KEY: ${BURLAK_API_KEY:-}
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
